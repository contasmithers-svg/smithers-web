name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CF_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy . \
            --project-name smithers-restaurant \
            --branch main
        shell: bash

      # Avisa a Bing de que el contenido ha cambiado. El indice de Bing es el
      # que alimenta ChatGPT Search y Copilot, asi que sin esto esos
      # asistentes pueden tardar semanas en ver los cambios.
      - name: Avisar a Bing via IndexNow
        run: python3 indexnow.py
        shell: bash
        continue-on-error: true